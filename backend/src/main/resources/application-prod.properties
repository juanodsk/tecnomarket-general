spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.user=${SPRING_FLYWAY_USERNAME}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD}

app.security.jwt.secret=${JWT_SECRET}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.security.cors.allow-http-localhost=${CORS_ALLOW_HTTP_LOCALHOST:false}
app.security.rate-limit.redis-enabled=true
app.security.refresh-cookie.secure=true
app.security.refresh-cookie.require-origin=true
app.security.trusted-proxies=${TRUSTED_PROXY_RANGES}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:1s}

app.storage.minio.enabled=true
app.storage.minio.endpoint=${STORAGE_MINIO_ENDPOINT}
app.storage.minio.access-key=${STORAGE_MINIO_ACCESS_KEY}
app.storage.minio.secret-key=${STORAGE_MINIO_SECRET_KEY}
app.storage.minio.public-base-url=${STORAGE_MINIO_PUBLIC_BASE_URL}
app.storage.minio.private-download-base-url=${STORAGE_MINIO_PRIVATE_DOWNLOAD_BASE_URL}
app.storage.minio.repair-evidence-public=false

app.notification.resend.api-key=${RESEND_API_KEY}
app.auth.email-verification.verify-url=${EMAIL_VERIFICATION_VERIFY_URL}
app.auth.email-verification.from=${EMAIL_VERIFICATION_FROM}
app.auth.password-reset.url=${PASSWORD_RESET_URL}

app.seed.enabled=false
app.seed.platform-admin.enabled=false
app.features.marketplace-enabled=${FEATURE_MARKETPLACE_ENABLED:false}
app.features.subscriptions-enabled=${FEATURE_SUBSCRIPTIONS_ENABLED:false}
app.features.commissions-enabled=${FEATURE_COMMISSIONS_ENABLED:false}
app.features.direct-sales-enabled=${FEATURE_DIRECT_SALES_ENABLED:false}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
server.max-http-request-header-size=${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:16KB}
server.tomcat.connection-timeout=${SERVER_CONNECTION_TIMEOUT:10s}
server.tomcat.keep-alive-timeout=${SERVER_KEEP_ALIVE_TIMEOUT:20s}
server.tomcat.max-connections=${SERVER_MAX_CONNECTIONS:500}
server.tomcat.accept-count=${SERVER_ACCEPT_COUNT:100}
server.tomcat.threads.max=${SERVER_MAX_THREADS:100}
server.tomcat.threads.min-spare=${SERVER_MIN_SPARE_THREADS:10}
server.compression.enabled=true

spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:3000}
spring.datasource.hikari.max-lifetime=${DB_CONNECTION_MAX_LIFETIME_MS:1800000}

logging.structured.format.console=ecs
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis,minio
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
info.app.name=TecMarket Backend
info.app.environment=production
