spring.datasource.url=jdbc:postgresql://localhost:5433/tecmarket_db
spring.datasource.username=tecmarket_user
spring.datasource.password=tecmarket_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:tecmarket}
app.security.jwt.audience=${JWT_AUDIENCE:tecmarket-api}
app.security.jwt.access-token-expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
app.security.jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
app.security.sessions.maximum-per-user=${MAX_SESSIONS_PER_USER:5}
app.security.sessions.retention-days=${SESSION_RETENTION_DAYS:30}
app.security.sessions.cleanup-cron=${SESSION_CLEANUP_CRON:0 15 3 * * *}
app.security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
app.security.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
app.security.refresh-cookie.domain=${REFRESH_COOKIE_DOMAIN:}
app.security.refresh-cookie.require-origin=${REFRESH_COOKIE_REQUIRE_ORIGIN:false}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.cors.allow-http-localhost=${CORS_ALLOW_HTTP_LOCALHOST:false}
app.security.rate-limit.redis-enabled=${RATE_LIMIT_REDIS_ENABLED:false}
app.security.trusted-proxies=${TRUSTED_PROXY_RANGES:}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:1s}
spring.data.redis.repositories.enabled=false

app.auth.email-verification.expiration-hours=${EMAIL_VERIFICATION_EXPIRATION_HOURS:24}
app.auth.email-verification.verify-url=${EMAIL_VERIFICATION_VERIFY_URL:http://localhost:8080/api/v1/auth/verify-email}
app.auth.email-verification.from=${EMAIL_VERIFICATION_FROM:no-reply@tecmarket.local}
app.auth.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.auth.password-reset.url=${PASSWORD_RESET_URL:http://localhost:3000/restablecer-contrasena}

app.notification.resend.api-key=${RESEND_API_KEY:}
app.notification.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}

app.seed.enabled=${SEED_ENABLED:false}
app.seed.platform-admin.enabled=${SEED_PLATFORM_ADMIN_ENABLED:false}
app.seed.platform-admin.email=${SEED_PLATFORM_ADMIN_EMAIL:}
app.seed.platform-admin.password=${SEED_PLATFORM_ADMIN_PASSWORD:}
app.seed.platform-admin.document-type-code=${SEED_PLATFORM_ADMIN_DOCUMENT_TYPE_CODE:}
app.seed.platform-admin.document-number=${SEED_PLATFORM_ADMIN_DOCUMENT_NUMBER:}
app.seed.platform-admin.name=${SEED_PLATFORM_ADMIN_NAME:}
app.seed.platform-admin.surname=${SEED_PLATFORM_ADMIN_SURNAME:}
app.seed.platform-admin.address=${SEED_PLATFORM_ADMIN_ADDRESS:}
app.seed.platform-admin.phone=${SEED_PLATFORM_ADMIN_PHONE:}
app.seed.platform-admin.city=${SEED_PLATFORM_ADMIN_CITY:}

# Pilot scope: non-essential modules stay unreachable until explicitly enabled.
app.features.marketplace-enabled=${FEATURE_MARKETPLACE_ENABLED:false}
app.features.subscriptions-enabled=${FEATURE_SUBSCRIPTIONS_ENABLED:false}
app.features.commissions-enabled=${FEATURE_COMMISSIONS_ENABLED:false}
app.features.direct-sales-enabled=${FEATURE_DIRECT_SALES_ENABLED:false}

spring.servlet.multipart.max-file-size=${STORAGE_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${STORAGE_MAX_REQUEST_SIZE:12MB}

app.storage.minio.enabled=${STORAGE_MINIO_ENABLED:false}
app.storage.minio.endpoint=${STORAGE_MINIO_ENDPOINT:}
app.storage.minio.access-key=${STORAGE_MINIO_ACCESS_KEY:}
app.storage.minio.secret-key=${STORAGE_MINIO_SECRET_KEY:}
app.storage.minio.public-base-url=${STORAGE_MINIO_PUBLIC_BASE_URL:}
app.storage.minio.private-download-base-url=${STORAGE_MINIO_PRIVATE_DOWNLOAD_BASE_URL:}
app.storage.minio.business-assets-bucket=${STORAGE_MINIO_BUCKET_BUSINESS_ASSETS:business-assets}
app.storage.minio.service-images-bucket=${STORAGE_MINIO_BUCKET_SERVICE_IMAGES:service-images}
app.storage.minio.repair-evidence-bucket=${STORAGE_MINIO_BUCKET_REPAIR_EVIDENCE:repair-order-evidence}
app.storage.minio.repair-evidence-public=${STORAGE_MINIO_REPAIR_EVIDENCE_PUBLIC:false}
app.storage.minio.max-image-size-bytes=${STORAGE_MINIO_MAX_IMAGE_SIZE_BYTES:10485760}
app.storage.minio.max-image-width=${STORAGE_MINIO_MAX_IMAGE_WIDTH:8000}
app.storage.minio.max-image-height=${STORAGE_MINIO_MAX_IMAGE_HEIGHT:8000}
app.storage.minio.max-image-pixels=${STORAGE_MINIO_MAX_IMAGE_PIXELS:25000000}
app.storage.minio.max-sanitized-image-size-bytes=${STORAGE_MINIO_MAX_SANITIZED_IMAGE_SIZE_BYTES:12582912}
app.storage.minio.presigned-expiration-minutes=${STORAGE_MINIO_PRESIGNED_EXPIRATION_MINUTES:10}
app.storage.minio.evidence-retention-days=${STORAGE_EVIDENCE_RETENTION_DAYS:90}
app.storage.minio.deletion-cleanup-cron=${STORAGE_DELETION_CLEANUP_CRON:0 */5 * * * *}
app.storage.minio.deletion-batch-size=${STORAGE_DELETION_BATCH_SIZE:50}
app.storage.minio.deletion-max-attempts=${STORAGE_DELETION_MAX_ATTEMPTS:10}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
