spring.datasource.url=jdbc:h2:mem:tecmarket_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

app.security.jwt.secret=12345678901234567890123456789012
app.security.jwt.issuer=tecmarket
app.security.jwt.audience=tecmarket-api
app.security.jwt.access-token-expiration-minutes=15
app.security.jwt.refresh-token-expiration-days=7
app.security.cors.allowed-origins=http://localhost:3000

app.auth.email-verification.expiration-hours=24
app.auth.email-verification.verify-url=http://localhost:8080/api/v1/auth/verify-email
app.auth.email-verification.from=no-reply@test.tecmarket

app.notification.resend.api-key=test-api-key

app.seed.enabled=true
app.seed.platform-admin.enabled=false
