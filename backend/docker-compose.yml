services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE pinned by digest is required}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      SPRING_PROFILES_ACTIVE: docker,prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_USERNAME: ${SPRING_FLYWAY_USERNAME:?SPRING_FLYWAY_USERNAME is required}
      SPRING_FLYWAY_PASSWORD: ${SPRING_FLYWAY_PASSWORD:?SPRING_FLYWAY_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-tecmarket}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tecmarket-api}
      JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRATION_DAYS: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-5}
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-30}
      REFRESH_COOKIE_SECURE: "true"
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-Lax}
      REFRESH_COOKIE_DOMAIN: ${REFRESH_COOKIE_DOMAIN:-}
      REFRESH_COOKIE_REQUIRE_ORIGIN: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CORS_ALLOW_HTTP_LOCALHOST: ${CORS_ALLOW_HTTP_LOCALHOST:-false}
      RATE_LIMIT_REDIS_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:?SPRING_DATA_REDIS_PASSWORD is required}
      TRUSTED_PROXY_RANGES: ${TRUSTED_PROXY_RANGES:?TRUSTED_PROXY_RANGES is required}
      FEATURE_MARKETPLACE_ENABLED: ${FEATURE_MARKETPLACE_ENABLED:-false}
      FEATURE_SUBSCRIPTIONS_ENABLED: ${FEATURE_SUBSCRIPTIONS_ENABLED:-false}
      FEATURE_COMMISSIONS_ENABLED: ${FEATURE_COMMISSIONS_ENABLED:-false}
      FEATURE_DIRECT_SALES_ENABLED: ${FEATURE_DIRECT_SALES_ENABLED:-false}
      EMAIL_VERIFICATION_EXPIRATION_HOURS: ${EMAIL_VERIFICATION_EXPIRATION_HOURS:-24}
      EMAIL_VERIFICATION_VERIFY_URL: ${EMAIL_VERIFICATION_VERIFY_URL:?EMAIL_VERIFICATION_VERIFY_URL is required}
      EMAIL_VERIFICATION_FROM: ${EMAIL_VERIFICATION_FROM:?EMAIL_VERIFICATION_FROM is required}
      PASSWORD_RESET_EXPIRATION_MINUTES: ${PASSWORD_RESET_EXPIRATION_MINUTES:-30}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:?PASSWORD_RESET_URL is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      RESEND_BASE_URL: ${RESEND_BASE_URL:-https://api.resend.com}
      STORAGE_MINIO_ENABLED: "true"
      STORAGE_MINIO_ENDPOINT: ${STORAGE_MINIO_ENDPOINT:?STORAGE_MINIO_ENDPOINT is required}
      STORAGE_MINIO_ACCESS_KEY: ${STORAGE_MINIO_ACCESS_KEY:?STORAGE_MINIO_ACCESS_KEY is required}
      STORAGE_MINIO_SECRET_KEY: ${STORAGE_MINIO_SECRET_KEY:?STORAGE_MINIO_SECRET_KEY is required}
      STORAGE_MINIO_PUBLIC_BASE_URL: ${STORAGE_MINIO_PUBLIC_BASE_URL:?STORAGE_MINIO_PUBLIC_BASE_URL is required}
      STORAGE_MINIO_PRIVATE_DOWNLOAD_BASE_URL: ${STORAGE_MINIO_PRIVATE_DOWNLOAD_BASE_URL:?STORAGE_MINIO_PRIVATE_DOWNLOAD_BASE_URL is required}
      STORAGE_MINIO_BUCKET_BUSINESS_ASSETS: ${STORAGE_MINIO_BUCKET_BUSINESS_ASSETS:-business-assets}
      STORAGE_MINIO_BUCKET_SERVICE_IMAGES: ${STORAGE_MINIO_BUCKET_SERVICE_IMAGES:-service-images}
      STORAGE_MINIO_BUCKET_REPAIR_EVIDENCE: ${STORAGE_MINIO_BUCKET_REPAIR_EVIDENCE:-repair-order-evidence}
      STORAGE_MINIO_REPAIR_EVIDENCE_PUBLIC: ${STORAGE_MINIO_REPAIR_EVIDENCE_PUBLIC:-false}
      STORAGE_MINIO_MAX_IMAGE_SIZE_BYTES: ${STORAGE_MINIO_MAX_IMAGE_SIZE_BYTES:-10485760}
      STORAGE_MINIO_MAX_IMAGE_WIDTH: ${STORAGE_MINIO_MAX_IMAGE_WIDTH:-8000}
      STORAGE_MINIO_MAX_IMAGE_HEIGHT: ${STORAGE_MINIO_MAX_IMAGE_HEIGHT:-8000}
      STORAGE_MINIO_MAX_IMAGE_PIXELS: ${STORAGE_MINIO_MAX_IMAGE_PIXELS:-25000000}
      STORAGE_MINIO_MAX_SANITIZED_IMAGE_SIZE_BYTES: ${STORAGE_MINIO_MAX_SANITIZED_IMAGE_SIZE_BYTES:-12582912}
      STORAGE_MINIO_PRESIGNED_EXPIRATION_MINUTES: ${STORAGE_MINIO_PRESIGNED_EXPIRATION_MINUTES:-10}
      STORAGE_EVIDENCE_RETENTION_DAYS: ${STORAGE_EVIDENCE_RETENTION_DAYS:-90}
      STORAGE_DELETION_CLEANUP_CRON: "${STORAGE_DELETION_CLEANUP_CRON:-0 */5 * * * *}"
      STORAGE_DELETION_BATCH_SIZE: ${STORAGE_DELETION_BATCH_SIZE:-50}
      STORAGE_DELETION_MAX_ATTEMPTS: ${STORAGE_DELETION_MAX_ATTEMPTS:-10}
      STORAGE_MAX_FILE_SIZE: ${STORAGE_MAX_FILE_SIZE:-10MB}
      STORAGE_MAX_REQUEST_SIZE: ${STORAGE_MAX_REQUEST_SIZE:-12MB}
      SEED_ENABLED: "false"
      SEED_PLATFORM_ADMIN_ENABLED: "false"
      SEED_PLATFORM_ADMIN_EMAIL: ${SEED_PLATFORM_ADMIN_EMAIL:-}
      SEED_PLATFORM_ADMIN_PASSWORD: ${SEED_PLATFORM_ADMIN_PASSWORD:-}
      SEED_PLATFORM_ADMIN_DOCUMENT_TYPE_CODE: ${SEED_PLATFORM_ADMIN_DOCUMENT_TYPE_CODE:-}
      SEED_PLATFORM_ADMIN_DOCUMENT_NUMBER: ${SEED_PLATFORM_ADMIN_DOCUMENT_NUMBER:-}
      SEED_PLATFORM_ADMIN_NAME: ${SEED_PLATFORM_ADMIN_NAME:-}
      SEED_PLATFORM_ADMIN_SURNAME: ${SEED_PLATFORM_ADMIN_SURNAME:-}
      SEED_PLATFORM_ADMIN_ADDRESS: ${SEED_PLATFORM_ADMIN_ADDRESS:-}
      SEED_PLATFORM_ADMIN_PHONE: ${SEED_PLATFORM_ADMIN_PHONE:-}
      SEED_PLATFORM_ADMIN_CITY: ${SEED_PLATFORM_ADMIN_CITY:-}
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/urandom}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - tecmarket
      - dokploy-network

  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:?SPRING_DATA_REDIS_PASSWORD is required}
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 128
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - tecmarket

volumes:
  redis_data:

networks:
  tecmarket:
    internal: true
  dokploy-network:
    external: true
    name: ${DOKPLOY_NETWORK_NAME:-dokploy-network}
